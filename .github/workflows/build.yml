name: Build Offline APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          cache: true
      - name: Initialize Android project files
        run: flutter create . --platforms=android --project-name offline_signature_app
      - name: Enable camera permission and keep PyTorch classes
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class org.pytorch.** { *; }
          -keepclassmembers class org.pytorch.** { *; }
          -dontwarn org.pytorch.**
          EOF
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/release {/release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts
          else
            sed -i 's/release {/release {\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle
          fi
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signature-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
